<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Leapollo emblem">
  <defs>
    <linearGradient id="lp-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="lp-sw" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- roundel -->
  <circle cx="50" cy="50" r="48" fill="url(#lp-g)"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- orbit ring -->
  <ellipse cx="50" cy="47" rx="34" ry="13.5" fill="none" stroke="#ffffff" stroke-width="2.1"
           stroke-opacity="0.92" transform="rotate(-27 50 47)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="26" r="1.5"/>
    <circle cx="66" cy="22" r="1.1"/>
    <circle cx="74" cy="40" r="1.4"/>
    <circle cx="24" cy="60" r="1.2"/>
    <circle cx="40" cy="74" r="1.5"/>
    <circle cx="70" cy="66" r="1.2"/>
    <circle cx="58" cy="76" r="1"/>
  </g>
  <!-- 4-point sparkle -->
  <path d="M46 20 L47.4 24.6 L52 26 L47.4 27.4 L46 32 L44.6 27.4 L40 26 L44.6 24.6 Z" fill="#ffffff"/>
  <!-- swoosh / vector -->
  <path d="M14 66 C40 61 64 51 88 23 C81 41 62 60 39 67 C31 69 21 69 14 66 Z" fill="url(#lp-sw)"/>
  <!-- planet dot -->
  <circle cx="50" cy="47" r="4.4" fill="#ffffff"/>
</svg>
